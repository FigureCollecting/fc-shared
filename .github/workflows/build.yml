name: Build and Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-hygiene:
    name: Test hygiene (testing doctrine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No real timers or client mocks in tests
        run: |
          # Testing doctrine: fake the network at the boundary (MSW), never mock
          # the client, and never use real timers. An explicit
          # "// test-doctrine-allow: <reason>" comment opts a line out.
          violations=$(grep -rnE "setTimeout|setInterval|jest\.mock\(.?axios|axios\.create\(" tests | grep -v "test-doctrine-allow" || true)
          if [ -n "$violations" ]; then
            echo "::error::Testing-doctrine violations (real timers or client mocks). Add '// test-doctrine-allow: <reason>' if intentional."
            echo "$violations"
            exit 1
          fi
          echo "No testing-doctrine violations found."

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: shared
          fail_ci_if_error: false
