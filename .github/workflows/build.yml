name: Build and Test

on:
  push:
    branches: ['**']  # every branch; the job-level gate below decides what runs
  pull_request:
    branches: [develop, main]

# ---------------------------------------------------------------------------
# CI policy: "fork shift-left" (see README, "CI on forks (shift-left)").
# Developers work on forks and open PRs to FigureCollecting/*. Every push
# event is gated per entry job by ONE expression (pull_request, schedule and
# workflow_dispatch behave exactly as before). The four push cases:
#   owner == FigureCollecting, ref develop|main -> RUN  (upstream integration branches, unchanged)
#   owner == FigureCollecting, any other ref    -> SKIP (upstream feature branches get CI via their PR)
#   owner != FigureCollecting, ref develop|main -> SKIP (fork develop/main are mirrors of upstream: run nothing)
#   owner != FigureCollecting, any other ref    -> RUN  (shift-left: CI on fork feature branches)
# Jobs that `needs:` a gated entry job skip cleanly (never fail) when it skips.
# Install/build steps authenticate with secrets.NODE_AUTH_TOKEN (fork-held PAT,
# read:packages only) and fall back to GITHUB_TOKEN on the org; publishing
# (GHCR push, npm publish, releases) is org-only.
# ---------------------------------------------------------------------------

jobs:
  test-hygiene:
    name: Test hygiene (testing doctrine)
    runs-on: ubuntu-latest
    # Push gate: the single CI-policy expression (four cases documented above).
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    steps:
      - uses: actions/checkout@v6
      - name: No real timers, client/fetch mocks, or snapshots in tests
        run: |
          # Testing doctrine §8.1: fake the network at the boundary (MSW), never
          # mock the raw HTTP client (jest.mock('axios'), axios.create stubs, or
          # global.fetch/globalThis.fetch reassignment), never use real timers,
          # and no serializer snapshots. Scoped to test files (*.test.*) so
          # setup.ts and tests/mocks helpers don't false-positive. An explicit
          # "// test-doctrine-allow: <reason>" comment opts a single line out.
          violations=$(grep -rnE \
            "setTimeout|setInterval|jest\.mock\(.?axios|axios\.create\(|global\.fetch[[:space:]]*=|globalThis\.fetch[[:space:]]*=|toMatchSnapshot" \
            --include='*.test.ts' --include='*.test.tsx' tests \
            | grep -v "test-doctrine-allow" || true)
          if [ -n "$violations" ]; then
            echo "::error::Testing-doctrine violations (real timers, client/fetch mocks, or snapshots). Add '// test-doctrine-allow: <reason>' if intentional."
            echo "$violations"
            exit 1
          fi
          # Committed serializer snapshots are banned outright — a .snap file has
          # no inline location to carry the escape-hatch comment.
          snapshots=$(find tests \( -type d -name '__snapshots__' -o -type f -name '*.snap' \) 2>/dev/null || true)
          if [ -n "$snapshots" ]; then
            echo "::error::Committed snapshot artifacts found (testing doctrine bans serializer snapshots)."
            echo "$snapshots"
            exit 1
          fi
          echo "No testing-doctrine violations found."

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    # Push gate: the single CI-policy expression (four cases documented above).
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        # org-only: no Codecov token is configured, so an upload from a fork push has
        # nothing to authenticate with and only logs an error. PRs from forks still
        # upload: repository_owner is the base repo's owner.
        if: github.repository_owner == 'FigureCollecting'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: shared
          fail_ci_if_error: false
